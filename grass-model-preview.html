<script type="module">
import * as T from 'three';import {createGrassCards} from './meadow-plants.js?v=20261008-01';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const scene=new T.Scene();scene.background=new T.Color('#d9e4d9');scene.add(new T.HemisphereLight(0xf1f4d9,0x65734c,2));const sun=new T.DirectionalLight(0xffefc7,2.8);sun.position.set(2,5,3);scene.add(sun);
const texture=await new T.TextureLoader().loadAsync('./assets/trees/grass-cards-v1-512.png'),asset=createGrassCards(texture);const mesh=new T.Mesh(asset.geometry,asset.material);scene.add(mesh);
const floor=new T.Mesh(new T.PlaneGeometry(8,8),new T.MeshLambertMaterial({color:0x91ad63}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,30);camera.position.set(1.8,1.2,3.3);camera.lookAt(0,.35,0);
renderer.setAnimationLoop(t=>{mesh.rotation.y=t*.00015;renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera)});
