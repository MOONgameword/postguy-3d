<script type="module">
import * as T from 'three';
import {createGrassCards} from './meadow-plants.js?v=20261008-08';
import {installSurfaceMaterials} from './surface-materials.js?v=20261008-08';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
const scene=new T.Scene();scene.background=new T.Color('#d9e4d9');scene.add(new T.HemisphereLight(0xb9c9c5,0x969b7d,1.35),new T.AmbientLight(0xe4dfcc,.55));const sun=new T.DirectionalLight(0xfff8e6,1.3);sun.position.set(2,5,3);scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(40,40),new T.MeshStandardMaterial({name:'City_Grass'}));floor.name='Planet';floor.rotation.x=-Math.PI/2;floor.position.y=600;scene.add(floor);
const loader=new T.TextureLoader(),surfaces=await installSurfaceMaterials(scene,renderer,url=>loader.loadAsync(url));

const mesh=new T.InstancedMesh(asset.geometry,asset.material,60);const obj=new T.Object3D();
for(let i=0;i<60;i++){obj.position.set(Math.sin(i*41.7)*7,599.92,Math.cos(i*17.1)*6);obj.rotation.y=i*2.4;obj.updateMatrix();mesh.setMatrixAt(i,obj.matrix)}scene.add(mesh);

renderer.setAnimationLoop(()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera)});
</script></html>
