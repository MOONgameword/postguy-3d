<title>小熊快送 · 今日必达</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:#0f1418; overflow:hidden; overscroll-behavior:none; touch-action:none;
            font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
/* 舞台铺满可视区域，竖着拿横着拿都不留黑边。
   高度别信 100dvh：安卓 Chrome 横屏里它比真正看得见的那块高（地址栏、
   手势条各算一次），底下那排摇杆油门就被顶到屏幕外面去了。真高度由
   game.js 的 fitStage() 按 visualViewport 写成行内 px，这里的 dvh 只是兜底。 */
#stage { position:relative; width:100vw; height:100vh; height:100dvh; margin:0 auto; overflow:hidden; }
#stage canvas#gl { display:block; width:100%; height:100%; }
.hud { position:absolute; inset:0; pointer-events:none; user-select:none; }
.hud > * { pointer-events:auto; }

.topbar { position:absolute; top:10px; left:10px; right:10px; display:flex; align-items:center; gap:8px; }
.res, .gear { flex:none; }
.avatar { position:relative; width:64px; height:64px; border-radius:50%; border:3px solid #fff; overflow:hidden; flex:none;
          box-shadow:0 2px 6px rgba(0,0,0,.3); background:#c9d6e2; }
.avatar svg { width:100%; height:100%; display:block; }
.avatar img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.avatar.img { border:none; background:none; }
.pname { color:#fff; font-size:18px; font-weight:700; text-shadow:0 2px 4px rgba(0,0,0,.5); }
.lvrow { display:flex; align-items:center; gap:6px; margin-top:4px; }
.lvbadge { width:24px; height:24px; border-radius:50%; background:#ffb42e; border:2px solid #fff; color:#7a4a00;
           font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.lvbar { width:112px; height:11px; border-radius:6px; background:rgba(0,0,0,.4); border:1.5px solid #fff; overflow:hidden; }
.lvbar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#ffd24a,#ff9d2e); transition:width .3s; }
.lvtxt { color:#fff; font-size:11px; text-shadow:0 1px 3px rgba(0,0,0,.6); }
.spacer { flex:1; }
.res { display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.92); border-radius:14px;
       padding:3px 7px 3px 5px; font-size:12px; font-weight:700; color:#4a3a2a; box-shadow:0 2px 5px rgba(0,0,0,.2); }
.res .ic { width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; }
.gold { background:#ffcf3f; color:#7a4a00; } .pack { background:#e8483f; color:#fff; }
.gear { width:32px; height:32px; border-radius:9px; background:rgba(255,255,255,.92); display:flex; align-items:center;
        justify-content:center; font-size:17px; box-shadow:0 2px 5px rgba(0,0,0,.2); }

.taskbar { position:absolute; top:86px; left:10px; display:flex; align-items:center; gap:8px; max-width:70%;
           background:rgba(255,255,255,.95); border-radius:12px; padding:8px 10px; box-shadow:0 3px 8px rgba(0,0,0,.22); }
.taskicon { width:26px; height:26px; border-radius:7px; background:#f3d9b0; display:flex; align-items:center;
            justify-content:center; font-size:15px; flex:none; }
.tasktxt b { display:block; font-size:13px; color:#3b2f26; }
.tasktxt span { display:block; font-size:11px; color:#8a7a6c; margin-top:1px; }
.taskarrow { margin-left:auto; color:#c9b9a8; font-size:19px; font-weight:800; padding-left:6px; }
.res .plus { width:16px; height:16px; border-radius:50%; background:#57c84d; color:#fff; font-style:normal;
             font-size:13px; font-weight:900; display:flex; align-items:center; justify-content:center; margin-left:3px; }
#fx { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.fx { position:absolute; font-size:26px; will-change:transform,opacity; transform:translate(-50%,-50%);
      text-shadow:0 2px 6px rgba(0,0,0,.35); z-index:5; }
.fx.pop { font-size:19px; font-weight:800; color:#ffb42e; text-shadow:0 2px 0 #7a4a00,0 3px 8px rgba(0,0,0,.4); }

/* 下面这套是竖屏的位置（小地图右上、按钮叠三层）。横屏的那套在文件末尾
   用 @media (orientation:landscape) 覆盖，两边都保留，手机转到哪面用哪套。 */
#mini { position:absolute; right:10px; top:86px; width:96px; height:96px; border-radius:12px;
        border:2px solid rgba(255,255,255,.85); background:rgba(20,30,40,.55); }
.compass { position:absolute; right:10px; top:188px; width:96px; text-align:center; color:#fff; font-size:11px;
           text-shadow:0 1px 3px rgba(0,0,0,.6); }
.compass .arw { font-size:26px; display:block; line-height:1; }

/* 竖屏：右边从下往上是 油门 / 下车 / 三个入口，一路占到 300 多的高度，
   所以速度表挪到左边，摆在提示文字上方，别跟「下车」压在一起。 */
.speed { position:absolute; left:12px; right:auto; bottom:250px; background:rgba(0,0,0,.42); color:#fff; border-radius:10px;
         padding:5px 9px; font-size:10px; text-align:center; line-height:1.3; }
.speed b { font-size:18px; }
.hint { position:absolute; left:12px; bottom:200px; color:#fff; font-size:11px; opacity:.85; line-height:1.5;
        text-shadow:0 1px 3px rgba(0,0,0,.6); }

/* 竖屏：三个入口右侧竖排，落在「下车」按钮上方 */
.bottom { position:absolute; right:14px; bottom:250px; left:auto; display:flex;
          flex-direction:column; align-items:center; gap:6px; }
.bbtn { width:76px; height:58px; border-radius:14px; background:linear-gradient(180deg,#ffd98a,#ffb347);
        border:3px solid #fff; box-shadow:0 4px 0 #d98b20,0 4px 10px rgba(0,0,0,.3);
        display:flex; flex-direction:column; align-items:center; justify-content:center; }
.bbtn:active { transform:translateY(2px); }
.bbtn em { font-size:20px; font-style:normal; line-height:1; }
.bbtn span { font-size:12px; font-weight:800; color:#6b4310; margin-top:2px; }
.bbtn img { height:76px; display:block; }
.bbtn.img { width:auto; height:auto; padding:0; background:none; border:none; box-shadow:none;
            filter:drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
.bbtn.img:active { transform:scale(.93); }
.bbtn.img em, .bbtn.img span { display:none; }

.stick { position:absolute; left:16px; bottom:88px; width:104px; height:104px; border-radius:50%;
         background:rgba(255,255,255,.16); border:2px solid rgba(255,255,255,.5); }
.stick i { position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%;
           background:rgba(255,255,255,.78); box-shadow:0 2px 6px rgba(0,0,0,.3); }
.gas { position:absolute; right:16px; bottom:88px; width:74px; height:74px; border-radius:50%;
       background:rgba(255,180,46,.88); border:3px solid #fff; color:#fff; font-size:14px; font-weight:800;
       display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(0,0,0,.3); }
.gas:active { background:rgba(255,140,20,.95); }
.gas.img:active, .brake.img:active { transform:scale(.93); }
#btnRide { position:absolute; right:16px; bottom:184px; width:56px; height:56px; border-radius:50%;
           background:rgba(255,255,255,.92); border:3px solid #ff9d2e; color:#c25b00; font-size:14px;
           font-weight:800; display:flex; align-items:center; justify-content:center;
           box-shadow:0 3px 8px rgba(0,0,0,.3); }
#btnRide:active { transform:scale(.93); }
.brake { position:absolute; right:100px; bottom:98px; width:56px; height:56px; border-radius:50%;
         background:rgba(60,70,80,.7); border:3px solid #fff; color:#fff; font-size:12px; font-weight:800;
         display:flex; align-items:center; justify-content:center; }
.gas img, .brake img { width:100%; height:100%; display:block; }
.bbtn img, .gas img, .brake img { pointer-events:none; }
.gas.img, .brake.img { background:none; border:none; box-shadow:none; font-size:0;
                       filter:drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
.gas.img { width:80px; height:80px; }
.brake.img { width:60px; height:60px; right:104px; bottom:100px; }

.toast { position:absolute; top:40%; left:50%; transform:translate(-50%,-50%) scale(.9); opacity:0;
         background:rgba(0,0,0,.75); color:#fff; padding:10px 18px; border-radius:20px; font-size:15px;
         font-weight:700; transition:.25s; white-space:nowrap; }
.toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }

.mask { position:absolute; inset:0; background:rgba(0,0,0,.45); display:none; }
.mask.on { display:block; }
.panel { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(82%,400px); background:#fff7ec;
         border:4px solid #fff; border-radius:18px; padding:14px; box-shadow:0 8px 24px rgba(0,0,0,.4); }
.panel h3 { font-size:16px; color:#6b4310; margin-bottom:10px; text-align:center; }
.panel .list { display:flex; flex-wrap:wrap; gap:8px; }
.panel .cell { width:calc(33.33% - 6px); aspect-ratio:1; background:#f0e2cd; border-radius:10px; display:flex;
               flex-direction:column; align-items:center; justify-content:center; font-size:11px; color:#8a6a44; gap:4px; }
.panel .cell em { font-size:22px; font-style:normal; }
.panel .close { margin-top:12px; height:34px; border-radius:10px; background:#ffb347; color:#fff; display:flex;
                align-items:center; justify-content:center; font-weight:800; font-size:14px; }

#loading { position:absolute; inset:0; background:#0f1418; color:#fff; display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:10px; font-size:14px; letter-spacing:1px; z-index:9; }
#loading .bar { width:60%; height:6px; border-radius:3px; background:rgba(255,255,255,.18); overflow:hidden; }
#loading .bar i { display:block; height:100%; width:0; background:#ffb347; transition:width .2s; }
#loading .tip { font-size:11px; letter-spacing:0; color:rgba(255,255,255,.55); text-align:center; padding:0 22px; }
#loading .err { font-size:12px; line-height:1.6; white-space:pre-wrap; text-align:left; padding:0 22px; color:#ff9b8f; }
#ldRetry { display:none; margin-top:4px; padding:10px 30px; font-size:15px; font-weight:800; color:#7a3f00;
           border:none; border-radius:22px; background:#ffb347; letter-spacing:1px; }
#ldRetry.on { display:block; }

#start { position:absolute; inset:0; z-index:10; display:none; flex-direction:column; align-items:center;
         justify-content:center; gap:16px; background:linear-gradient(180deg,#2f92e0,#7cc4f2 55%,#dcf1ff);
         color:#20364a; text-align:center; padding:24px; }
#start.on { display:flex; }
#start h1 { font-size:26px; letter-spacing:2px; color:#fff; text-shadow:0 3px 8px rgba(0,60,110,.45); }
#start p { font-size:13px; line-height:1.8; color:#0d3350; opacity:.9; }
#start button { margin-top:6px; padding:13px 40px; font-size:17px; font-weight:800; color:#7a3f00; border:none;
                border-radius:26px; background:linear-gradient(180deg,#ffd15c,#ff9f2e);
                box-shadow:0 6px 0 #d8781a, 0 10px 18px rgba(0,0,0,.25); }
#start button:active { transform:translateY(3px); box-shadow:0 3px 0 #d8781a; }
/* 竖屏窄机（宽 430 以下）：头像、按钮整体收一档 */
@media (orientation:portrait) and (max-width:430px) {
  .topbar { gap:6px; }
  .avatar { width:56px; height:56px; }
  .pname { font-size:16px; }
  .lvbar { width:92px; }
  .lvbadge { width:22px; height:22px; font-size:12px; }
  .res { font-size:11px; padding:2px 6px 2px 4px; }
  .res .ic { width:16px; height:16px; }
  .res .plus { display:none; }
  .gear { width:28px; height:28px; font-size:15px; }
  .taskbar, #mini { top:78px; }
  .compass { top:180px; }
  .bbtn img { height:66px; }
  .bottom { bottom:234px; right:10px; }
  #btnRide { width:50px; height:50px; font-size:13px; bottom:174px; }
  .gas.img { width:74px; height:74px; }
  .brake.img { width:56px; height:56px; }
}

/* 横屏：只有一半的高度可用，所以按钮不再叠三层，压成底部一条——
   左摇杆、中间三个入口、右油门刹车；小地图和罗盘往上挪。 */
@media (orientation:landscape) {
  #mini { top:76px; width:88px; height:88px; }
  .compass { top:170px; width:88px; }
  .compass .arw { font-size:24px; }
  .speed { left:auto; right:96px; bottom:116px; }
  .hint { bottom:140px; }
  .bottom { left:50%; right:auto; bottom:12px; transform:translateX(-50%);
            flex-direction:row; align-items:flex-end; gap:10px; }
  .bbtn img { height:64px; }
  .stick { bottom:22px; width:100px; height:100px; }
  .stick i { width:44px; height:44px; margin:-22px 0 0 -22px; }
  .gas { bottom:22px; }
  .gas.img { width:78px; height:78px; }
  .brake { bottom:30px; right:100px; width:54px; height:54px; }
  .brake.img { width:58px; height:58px; right:102px; bottom:32px; }
  #btnRide { bottom:112px; width:52px; height:52px; font-size:13px; }
}
/* 横屏矮屏（多数手机横过来就是 380~430 高）：再收一档 */
@media (orientation:landscape) and (max-height:430px) {
  .topbar { gap:6px; top:8px; }
  .avatar { width:52px; height:52px; }
  .pname { font-size:15px; }
  .lvbar { width:92px; height:9px; }
  .lvbadge { width:20px; height:20px; font-size:11px; }
  .lvtxt { display:none; }
  .res { font-size:11px; padding:2px 6px 2px 4px; }
  .res .ic { width:16px; height:16px; }
  .res .plus { display:none; }
  .gear { width:28px; height:28px; font-size:15px; }
  .taskbar { top:66px; padding:6px 8px; max-width:44%; }
  .tasktxt span { display:none; }
  #mini { top:66px; width:76px; height:76px; }
  .compass { top:146px; width:76px; font-size:10px; }
  .compass .arw { font-size:20px; }
  .bbtn img { height:54px; }
  .bottom { bottom:8px; gap:8px; }
  #btnRide { width:46px; height:46px; font-size:12px; bottom:96px; }
  .speed { right:84px; bottom:100px; }
  .hint { bottom:120px; font-size:10px; }
  .stick { width:86px; height:86px; bottom:16px; }
  .stick i { width:38px; height:38px; margin:-19px 0 0 -19px; }
  .gas.img { width:68px; height:68px; }
  .brake.img { width:50px; height:50px; right:88px; bottom:28px; }
}
</style>

<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div class="film-edge" aria-hidden="true"></div>
  <div class="hud">
    <div class="topbar">
      <div class="avatar">
        <svg viewBox="0 0 52 52"><rect width="52" height="52" fill="#bcd3e6"/>
          <circle cx="26" cy="20" r="11" fill="#f6d2b0"/>
          <path d="M13 19a13 13 0 0126 0c0-9-6-13-13-13s-13 4-13 13z" fill="#3b2b23"/>
          <path d="M7 52c2-13 9-19 19-19s17 6 19 19z" fill="#f2f2f2"/></svg>
        <img src="./assets/ui/panda-avatar-v1.png" alt="" onload="this.parentNode.classList.add('img')" onerror="this.remove()">
      </div>
      <div>
        <div class="pname">小熊快送<span class="edition">今日必达</span></div>

      <button class="gear" id="btnGear" aria-label="操作提示">☰</button>
    </div>

    <div class="taskbar"><div class="taskicon" id="taskIcon">📮</div>

      <div class="taskarrow">›</div></div>

    <canvas id="mini" width="192" height="192"></canvas>

    <div class="stick" id="stick"><i id="knob"></i></div>

</div>
<script>
(function () {
  var err = document.getElementById('ldErr');
  function show(t) { err.textContent = t; }
  window.addEventListener('error', function (e) { show('脚本错误：\n' + (e.message || e.type) + '\n' + (e.filename || '')); });
  window.addEventListener('unhandledrejection', function (e) {
    show('加载失败：\n' + (e.reason && (e.reason.message || e.reason) || '未知'));
